/* OKLab R0-R2 mathematical core. All RGB components are 0..1 encoded sRGB unless stated. */
(function(root){
 &#x27;use strict&#x27;;
 const clip=(x,min=0,max=1)=&gt;Math.min(max,Math.max(min,x));
 const srgbToLinear=x=&gt;x&lt;=0.04045?x/12.92:Math.pow((x+0.055)/1.055,2.4);
 const linearToSrgb=x=&gt;x&lt;=0.0031308?12.92*x:1.055*Math.pow(x,1/2.4)-0.055;
 function toOKLab(rgb){
   const [r,g,b]=rgb.map(srgbToLinear);
   const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b);
   const m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b);
   const s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
   return [0.2104542553*l+0.7936177850*m-0.0040720468*s,1.9779984951*l-2.4285922050*m+0.4505937099*s,0.0259040371*l+0.7827717662*m-0.8086757660*s];
 }
 function toLinearRGB([L,a,b]){
   const l=Math.pow(L+0.3963377774*a+0.2158037573*b,3);
   const m=Math.pow(L-0.1055613458*a-0.0638541728*b,3);
   const s=Math.pow(L-0.0894841775*a-1.2914855480*b,3);
   return [4.0767416621*l-3.3077115913*m+0.2309699292*s,-1.2684380046*l+2.6097574011*m-0.3413193965*s,-0.0041960863*l-0.7034186147*m+1.7076147010*s];
 }
 function inGamut(lin){return lin.every(x=&gt;Number.isFinite(x)&amp;&amp;x&gt;=-1e-7&amp;&amp;x&lt;=1+1e-7)}
 function toSrgb(lab){return toLinearRGB(lab).map(x=&gt;linearToSrgb(clip(x)))}
 function rgb8(rgb){return rgb.map(x=&gt;Math.round(255*clip(x)))}
 function hexFromRgb(rgb){return &#x27;#&#x27;+rgb8(rgb).map(x=&gt;x.toString(16).padStart(2,&#x27;0&#x27;)).join(&#x27;&#x27;).toUpperCase()}
 function rgbFromHex(value){if(!/^#[0-9a-f]{6}$/i.test(value))return null;return [1,3,5].map(i=&gt;parseInt(value.slice(i,i+2),16)/255)}
 function gamutMap(L,a,b){ // constant L, same hue, reduce chroma only
   L=clip(L);
   let rgb=toLinearRGB([L,a,b]);
   if(inGamut(rgb))return {a,b,linear:rgb,mapped:false};
   let low=0,high=1;
   for(let i=0;i&lt;25;i++){
     const t=(low+high)/2;
     if(inGamut(toLinearRGB([L,a*t,b*t])))low=t;else high=t;
   }
   const scale=low*.9999;
   return {a:a*scale,b:b*scale,linear:toLinearRGB([L,a*scale,b*scale]),mapped:true};
 }
 function maxChroma(L,h){
   const a=Math.cos(h),b=Math.sin(h);
   let low=0,high=.55;
   for(let k=0;k&lt;21;k++){
     const mid=(low+high)/2;
     if(inGamut(toLinearRGB([L,a*mid,b*mid])))low=mid;else high=mid;
   }
   return low;
 }
 function planeExtent(L){
   let max=0;
   for(let deg=0;deg&lt;360;deg+=6)max=Math.max(max,maxChroma(L,deg*Math.PI/180));
   return Math.max(.045,max*1.18);
 }
 function test(){
   let worst=0,roundTrips=0,correct=true,gamutErrors=0,rangeChecks=0;
   for(let r=0;r&lt;=255;r+=51)for(let g=0;g&lt;=255;g+=51)for(let b=0;b&lt;=255;b+=51){
     const rgb=[r/255,g/255,b/255]; const lab=toOKLab(rgb);const lin=toLinearRGB(lab).map(linearToSrgb);
     worst=Math.max(worst,...rgb.map((x,i)=&gt;Math.abs(x-lin[i])*255));roundTrips++;
   }
   for(let L=.05;L&lt;1;L+=.07)for(let h=0;h&lt;Math.PI*2;h+=Math.PI/12){
     const a=Math.cos(h)*.45,b=Math.sin(h)*.45;const m=gamutMap(L,a,b);
     if(!inGamut(m.linear)||Math.abs(toOKLab(m.linear.map(linearToSrgb))[0]-L)&gt;1e-5)gamutErrors++;
     rangeChecks++;
   }
   return {roundTrips,worst8Bit:worst,rangeChecks,gamutErrors,pass:worst&lt;.0005&amp;&amp;gamutErrors===0};
 }
 root.ColorCore={clip,srgbToLinear,linearToSrgb,toOKLab,toLinearRGB,inGamut,toSrgb,rgb8,hexFromRgb,rgbFromHex,gamutMap,maxChroma,planeExtent,test};

<script id="tourbox-oklab-core">
/* OKLab R0-R2 mathematical core. All RGB components are 0..1 encoded sRGB unless stated. */
(function(root){
 'use strict';
 const clip=(x,min=0,max=1)=>Math.min(max,Math.max(min,x));
 const srgbToLinear=x=>x<=0.04045?x/12.92:Math.pow((x+0.055)/1.055,2.4);
 const linearToSrgb=x=>x<=0.0031308?12.92*x:1.055*Math.pow(x,1/2.4)-0.055;
 function toOKLab(rgb){
   const [r,g,b]=rgb.map(srgbToLinear);
   const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b);
   const m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b);
   const s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
   return [0.2104542553*l+0.7936177850*m-0.0040720468*s,1.9779984951*l-2.4285922050*m+0.4505937099*s,0.0259040371*l+0.7827717662*m-0.8086757660*s];
 }
 function toLinearRGB([L,a,b]){
   const l=Math.pow(L+0.3963377774*a+0.2158037573*b,3);
   const m=Math.pow(L-0.1055613458*a-0.0638541728*b,3);
   const s=Math.pow(L-0.0894841775*a-1.2914855480*b,3);
   return [4.0767416621*l-3.3077115913*m+0.2309699292*s,-1.2684380046*l+2.6097574011*m-0.3413193965*s,-0.0041960863*l-0.7034186147*m+1.7076147010*s];
 }
 function inGamut(lin){return lin.every(x=>Number.isFinite(x)&&x>=-1e-7&&x<=1+1e-7)}
 function toSrgb(lab){return toLinearRGB(lab).map(x=>linearToSrgb(clip(x)))}
 function rgb8(rgb){return rgb.map(x=>Math.round(255*clip(x)))}
 function hexFromRgb(rgb){return '#'+rgb8(rgb).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}
 function rgbFromHex(value){if(!/^#[0-9a-f]{6}$/i.test(value))return null;return [1,3,5].map(i=>parseInt(value.slice(i,i+2),16)/255)}
 function gamutMap(L,a,b){ // constant L, same hue, reduce chroma only
   L=clip(L);
   let rgb=toLinearRGB([L,a,b]);
   if(inGamut(rgb))return {a,b,linear:rgb,mapped:false};
   let low=0,high=1;
   for(let i=0;i<25;i++){
     const t=(low+high)/2;
     if(inGamut(toLinearRGB([L,a*t,b*t])))low=t;else high=t;
   }
   const scale=low*.9999;
   return {a:a*scale,b:b*scale,linear:toLinearRGB([L,a*scale,b*scale]),mapped:true};
 }
 function maxChroma(L,h){
   const a=Math.cos(h),b=Math.sin(h);
   let low=0,high=.55;
   for(let k=0;k<21;k++){
     const mid=(low+high)/2;
     if(inGamut(toLinearRGB([L,a*mid,b*mid])))low=mid;else high=mid;
   }

 }
 function planeExtent(L){

   for(let deg=0;deg<360;deg+=6)max=Math.max(max,maxChroma(L,deg*Math.PI/180));
   return Math.max(.045,max*1.18);
 }
 function test(){
   let worst=0,roundTrips=0,correct=true,gamutErrors=0,rangeChecks=0;
   for(let r=0;r<=255;r+=51)for(let g=0;g<=255;g+=51)for(let b=0;b<=255;b+=51){
     const rgb=[r/255,g/255,b/255]; const lab=toOKLab(rgb);const lin=toLinearRGB(lab).map(linearToSrgb);
     worst=Math.max(worst,...rgb.map((x,i)=>Math.abs(x-lin[i])*255));roundTrips++;
   }
   for(let L=.05;L<1;L+=.07)for(let h=0;h<Math.PI*2;h+=Math.PI/12){
     const a=Math.cos(h)*.45,b=Math.sin(h)*.45;const m=gamutMap(L,a,b);

  if(p.paletteMode==='full'){
    const x=2*u-1,y=1-2*v,r=Math.max(Math.abs(x),Math.abs(y));
    if(r<1e-8)return [L,0,0];
    const h=Math.atan2(y,x),c=tbChroma(bound.chroma,h)*r;
    return [L,c*Math.cos(h),c*Math.sin(h)];
  }
  return [L,bound.cx+(u-.5)*2*bound.extent,bound.cy+(.5-v)*2*bound.extent];
}
function tbUV(p,L,a,b){
  const bound=tbBounds(L);
  if(p.paletteMode==='full'){
    const C=Math.hypot(a,b);
    if(C<1e-8)return [.5,.5];
    const h=Math.atan2(b,a),max=TB.maxChroma(L,h);
    const rad=clamp(C/Math.max(.00001,max),0,1);
    const cs=Math.cos(h),sn=Math.sin(h),s=rad/Math.max(Math.abs(cs),Math.abs(sn),1e-8);
    return [clamp(.5+.5*cs*s,0,1),clamp(.5-.5*sn*s,0,1)];
  }
  return [clamp(.5+(a-bound.cx)/(2*bound.extent),0,1),clamp(.5-(b-bound.cy)/(2*bound.extent),0,1)];
}
function tbEnsure(p){
  if(p.paletteMode!=='full')p.paletteMode='focus';
  if(!Number.isFinite(p.pickA)||!Number.isFinite(p.pickB)){
    const [_,a,b]=tbLab(p.base);p.pickA=a;p.pickB=b;
  }
  const m=TB.gamutMap(tbL(p),p.pickA,p.pickB);
  p.pickA=m.a;p.pickB=m.b;
}
function paletteColor(p,u,v){
  tbEnsure(p);
  const [L,a,b]=tbPoint(p,u,v),lin=TB.toLinearRGB([L,a,b]);
  if(p.paletteMode==='focus'&&!TB.inGamut(lin))return null;
  return tbHex(L,a,b);
}
function drawPalettePlane(canvas,p){
  tbEnsure(p);
  const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,im=ctx.createImageData(w,h);
  const L=tbL(p),bound=tbBounds(L),full=p.paletteMode==='full';
  for(let y=0;y<h;y++){
    const dy=1-2*(y+.5)/h;
    for(let x=0;x<w;x++){
      const dx=2*(x+.5)/w-1;
      let a,b;
      if(full){
        const r=Math.max(Math.abs(dx),Math.abs(dy)),theta=Math.atan2(dy,dx),c=tbChroma(bound.chroma,theta)*r;
        a=c*Math.cos(theta);b=c*Math.sin(theta);
      } else {a=bound.cx+dx*bound.extent;b=bound.cy+dy*bound.extent;}
      const lin=TB.toLinearRGB([L,a,b]),j=(y*w+x)*4;
      let vals;
      if(!full&&!TB.inGamut(lin)) vals=[150,150,150];
      else vals=TB.rgb8(lin.map(c=>TB.linearToSrgb(clamp(c,0,1))));
      im.data[j]=vals[0];im.data[j+1]=vals[1];im.data[j+2]=vals[2];im.data[j+3]=255;
    }
  }
  ctx.putImageData(im,0,0);
}
function tbRampRange(p){
  const l=tbL0(p);
  if(p.paletteMode==='full')return {min:.002,max:.998,lo:.002,hi:.998};
  return {min:clamp(l-.21,0,1),max:clamp(l+.21,0,1),lo:clamp(l-.085,0,1),hi:clamp(l+.085,0,1)};
}
function tbDrawRamp(canvas,p){
  const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,im=ctx.createImageData(w,h);
  const range=tbRampRange(p);
  for(let x=0;x<w;x++){
    const L=range.min+(range.max-range.min)*(x+.5)/w;
    const allowed=L>=range.lo&&L<=range.hi;
    const ar=allowed?TB.gamutMap(L,p.pickA,p.pickB).linear:null;
    const color=allowed?TB.rgb8(ar.map(c=>TB.linearToSrgb(clamp(c,0,1)))):[150,150,150];
    for(let y=0;y<h;y++){
      const k=4*(y*w+x);im.data[k]=color[0];im.data[k+1]=color[1];im.data[k+2]=color[2];im.data[k+3]=255;
    }
  }
  ctx.putImageData(im,0,0);
}

function tiffFromCanvas(canvas){

<script id="r30-tutorial-and-halftone">
(()=>{
  'use strict';
  const iframe=document.getElementById('liveTutorial');
  window.colorPickerTutorialOpen=()=>{
    iframe.hidden=false;
    document.body.style.overflow='hidden';
    iframe.contentWindow?.postMessage({origin:'color-picker-r30',action:'open'},'*');
  };
  window.addEventListener('message',e=>{
    if(e.source!==iframe.contentWindow||!e.data||e.data.origin!=='color-picker-r30-tutorial')return;
    if(e.data.action==='close'){iframe.hidden=true;document.body.style.overflow='';}
  });
  document.body.style.overflow='hidden';
  // R3.2 animated halftone: bottom layer only; shared moving wave formula with tutorial.
  const panel=document.getElementById('stageEmpty'),cv=document.getElementById('workspaceHalftone');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last=0,active=true;
  function paint(clock){
    if(panel.style.display==='none'||!panel.isConnected)return;
    const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;
    const dpr=Math.min(devicePixelRatio||1,1.6),w=r.width,h=r.height;
    if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
    const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);

    // Selected animation: a uniform, fine-dot field drifting diagonally.
    // The upper gray layer remains still; dots do not pulse or grow.
    const spacing=11, seconds=reduced?0:clock/1000;
    const offsetX=(seconds*8.5)%spacing, offsetY=(seconds*5.5)%spacing;
    for(let y=-spacing+offsetY;y<h+spacing;y+=spacing){
      const depth=Math.max(0,Math.min(1,(y+7)/h));
      const alpha=.10+.32*depth*depth;
      ctx.fillStyle=`rgba(83,70,91,${alpha.toFixed(3)})`;
      for(let x=-spacing+offsetX;x<w+spacing;x+=spacing){
        ctx.beginPath();ctx.arc(x,y,1.12,0,Math.PI*2);ctx.fill();
      }
    }

  }
  function animate(t){
    if(t-last>=34&&!document.hidden&&panel.style.display!=='none'){paint(t);last=t}
    requestAnimationFrame(animate);
  }
  paint(performance.now());
  requestAnimationFrame(animate);
  if('ResizeObserver' in window)new ResizeObserver(()=>paint(performance.now())).observe(cv);
  window.addEventListener('visibilitychange',()=>{if(!document.hidden)paint(performance.now())});
})();
</script>

#tb-feedback-panel button{border-radius:9px;padding:6px 13px;font-size:12.5px;cursor:pointer;border:1px solid rgba(255,255,255,.16);background:transparent;color:#dfe4ec;font-family:inherit}
#tb-feedback-panel button.primary{background:#f476b8;border-color:#f476b8;color:#1c1017;font-weight:600}
#tb-feedback-panel button.primary:disabled{opacity:.55;cursor:default}
#tb-feedback-toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:612;background:rgba(20,22,28,.95);border:1px solid rgba(255,255,255,.14);color:#f2f4f8;padding:8px 15px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
#tb-feedback-toast.show{opacity:1}
#tb-feedback-guide{position:fixed;right:76px;bottom:20px;z-index:613;width:max-content;max-width:min(238px,calc(100vw - 112px));box-sizing:border-box;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(20,22,28,.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 12px 32px rgba(0,0,0,.42);padding:10px 12px;color:#eef1f6;font-family:inherit;font-size:12px;line-height:1.55;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .28s ease,transform .28s ease}
#tb-feedback-guide.show{opacity:1;transform:none;pointer-events:none}
#tb-feedback-guide button{pointer-events:auto}
/* 手机端：气泡原本压在色盘卡片上，会吞掉取色点击 → 收窄并挪到右下角 FAB 上方，正文不拦截点击 */
@media (max-width:560px){
  #tb-feedback-guide{left:auto;right:8px;bottom:68px;top:auto;max-width:min(168px,calc(100vw - 24px));width:auto}
  #tb-feedback-guide .arrow{display:none}
}
#tb-feedback-guide p{margin:0 0 6px}
#tb-feedback-guide strong{color:#f476b8;font-weight:600}
#tb-feedback-guide button{border:0;background:transparent;padding:0;color:#93a4bc;font-size:11.5px;cursor:pointer;font-family:inherit;text-decoration:underline}
#tb-feedback-guide button:hover{color:#dfe4ec}
#tb-feedback-guide .arrow{position:absolute;right:-6px;bottom:13px;width:11px;height:11px;background:rgba(20,22,28,.93);border-right:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14);transform:rotate(-45deg)}
</style>
<button id="tb-feedback-fab" type="button" aria-label="留言反馈" title="留言反馈">✎</button>
<section id="tb-feedback-panel" aria-label="留言反馈">
  <h3>留言反馈</h3>
  <p class="tip">内容只会发送给站长本人，其他访客看不到。</p>
  <input id="tb-feedback-nick" type="text" maxlength="20" placeholder="怎么称呼你（选填）" autocomplete="off">
  <textarea id="tb-feedback-body" maxlength="500" placeholder="说说你的想法、遇到的问题或建议"></textarea>
  <div class="row"><button type="button" id="tb-feedback-cancel">取消</button><button type="button" class="primary" id="tb-feedback-send">发送</button></div>
</section>
<div id="tb-feedback-toast" role="status" aria-live="polite"></div>
<aside id="tb-feedback-guide" role="note" hidden>
  <p>有问题或建议？点右下角 <strong>✎</strong> 给站长留言，只有站长看得到。</p>
  <button type="button" id="tb-feedback-guide-ok">知道了</button>
  <span class="arrow" aria-hidden="true"></span>
</aside>
<script id="r37-feedback">(function(){
  var fab=document.getElementById('tb-feedback-fab');
  var panel=document.getElementById('tb-feedback-panel');
  var nick=document.getElementById('tb-feedback-nick');
  var body=document.getElementById('tb-feedback-body');
  var toast=document.getElementById('tb-feedback-toast');
  var sendBtn=document.getElementById('tb-feedback-send');
  var toastTimer=null;
  function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast.classList.remove('show')},2600)}
  fab.addEventListener('click',function(){panel.classList.toggle('open');if(panel.classList.contains('open'))body.focus()});
  document.getElementById('tb-feedback-cancel').addEventListener('click',function(){panel.classList.remove('open')});
  sendBtn.addEventListener('click',function(){
    var text=body.value.trim();
    if(!text){say('写点什么再发送吧');return}
    var meta=document.querySelector('meta[name="csrf-token"]');
    var csrf=(meta&&meta.content)||'';
    sendBtn.disabled=true;
    fetch('/api/apps/ok-color-board/messages',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf},body:JSON.stringify({nickname:nick.value.trim(),body:text})})
      .then(function(r){return r.json().then(function(d){return {ok:r.ok,data:d}}).catch(function(){return {ok:r.ok,data:{}}})})
      .then(function(res){
        if(!res.ok)throw new Error(res.data.error||('发送失败 ('+res.status+')'));
        say('已收到，谢谢你的反馈！');body.value='';nick.value='';panel.classList.remove('open');
      })
      .catch(function(e){say(e.message||'发送失败，请稍后再试')})
      .finally(function(){sendBtn.disabled=false});
  });
  // 每个新浏览器标签会话首次进入时提示一次；关闭或点击“知道了”后本次不再打扰。
  // 新开标签/新会话会重新提示；?guide=1 可随时预览提示。
  var guide=document.getElementById('tb-feedback-guide');
  var guideOk=document.getElementById('tb-feedback-guide-ok');
  var SESSION_KEY='tb-feedback-guide-session-v2';
  var force=false;
  try{force=/(?:[?&])guide=(?:1|force)(?:&|$)/.test(location.search)}catch(e){}
  function seenThisSession(){try{return sessionStorage.getItem(SESSION_KEY)==='1'}catch(e){return false}}
  function markThisSession(){if(force)return;try{sessionStorage.setItem(SESSION_KEY,'1')}catch(e){}}
  if(guide&&(force||!seenThisSession())){
    setTimeout(function(){guide.hidden=false;markThisSession();setTimeout(function(){guide.classList.add('show')},20)},1200);
    setTimeout(function(){guide.classList.remove('show')},13000);
    guide.addEventListener('click',function(e){guide.classList.remove('show');markThisSession();if(e.target===guideOk)return;panel.classList.add('open');if(body)body.focus()});
  }
})();</script>
<script id="tb-visit-beacon">
/* 访问统计埋点：记录访客到达/停留/离开，供站主后台查看“多少人访问、停留多久”。
 * - 自动在整页加载时按 URL 判定区域：/apps/<id>/ → tool；/portfolio → portfolio；/ → site；/admin → 不统计
 * - 软导航（SPA pushState）不刷新页面，由 app.js 调用 TBVisit.switch(scope, projectId) 切换区域
 * - 心跳每 30s 刷新“最后在线”，离开/切后台时尽力上报；sendBeacon 保证关页时也能送达
 * 站长/管理员自己的访问由后端识别会话后静默不计入。 */
(function () {
  var PING_EVERY = 30000;
  var cur = null, timer = null, gen = 0;   // gen：代数锁，晚到的旧 start 响应不覆盖新状态

  function metaCsrf() {
    var m = document.querySelector('meta[name="csrf-token"]');
    return (m && m.content) || '';
  }
  function post(path, body) {
    body = body || {};
    var csrf = metaCsrf();
    if (csrf) body.csrf = csrf;
    return fetch(path, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body), keepalive: true
    }).then(function (r) { return r.json().catch(function () { return {}; }); })
      .catch(function () { return {}; });
  }
  function schedulePing() {
    if (timer) clearInterval(timer);
    timer = setInterval(ping, PING_EVERY);
  }
  function start(scope, projectId) {
    var my = ++gen;
    post('/api/visit/start', { scope: scope, projectId: projectId || '' }).then(function (d) {
      if (my !== gen) return;               // 已被更新的 start/end 取代，丢弃迟到响应
      if (d && d.id && !d.skipped) {
        cur = { id: d.id, scope: scope, projectId: projectId || '' };
        schedulePing();
      }
    });
  }
  function ping() { if (cur) post('/api/visit/ping', { id: cur.id }); }
  function end() {
    gen++;                                   // 令任何进行中的 start 响应失效
    if (!cur) return;
    var id = cur.id;
    cur = null;
    if (timer) { clearInterval(timer); timer = null; }
    var payload = JSON.stringify({ id: id, csrf: metaCsrf() });
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/visit/end', new Blob([payload], { type: 'application/json' }));
        return;
      }
    } catch (e) { /* 回退到 fetch */ }
    post('/api/visit/end', { id: id });
  }
  function switchTo(scope, projectId) {
    end();
    start(scope, projectId);
  }
  function autoDetect() {
    var p = location.pathname;
    var m = p.match(/^\/apps\/([^\/?#]+)/);
    if (m) return { scope: 'tool', projectId: m[1] };
    if (p.indexOf('/portfolio') === 0) return { scope: 'portfolio', projectId: '' };
    if (p.indexOf('/admin') === 0) return null;           // 后台不计
    return { scope: 'site', projectId: '' };
  }

  document.addEventListener('visibilitychange', function () { if (document.hidden) ping(); });
  window.addEventListener('pagehide', end);
  window.addEventListener('beforeunload', end);

  function boot() {
    var area = autoDetect();
    if (area) start(area.scope, area.projectId);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  window.TBVisit = {
    start: start, end: end, ping: ping,
    switch: switchTo,
    current: function () { return cur ? { scope: cur.scope, projectId: cur.projectId } : null; }
  };
})();
</script>
</body>
</html>
